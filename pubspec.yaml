name: fintribe
description: "FinTribe - A scalable Flutter financial application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ───────────────────────────────────────────
  riverpod: ^3.3.2
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0

  # ── Networking ──────────────────────────────────────────────────
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^7.2.0

  # ── Code Generation & Immutable Models ──────────────────────────
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # ── Local Storage (offline-first SQLite) ────────────────────────
  sqflite: ^2.4.1
  path: ^1.9.0

  # ── Routing ─────────────────────────────────────────────────────
  go_router: ^17.3.0

  # ── UI & Utilities ──────────────────────────────────────────────
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  gap: ^3.0.1
  google_fonts: ^8.1.0
  intl: ^0.20.3
  logger: ^2.5.0
  equatable: ^2.0.7
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── Code Generators ─────────────────────────────────────────────
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0

  # ── Linting ─────────────────────────────────────────────────────
  flutter_lints: ^6.0.0

  # ── Testing ─────────────────────────────────────────────────────
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.4  # in-memory SQLite for unit tests

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/img/
